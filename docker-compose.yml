services:
  web:
    build: .
    container_name: lts-website
    restart: unless-stopped
    ports:
      # Host-Port 2015 -> Container-Port 3000
      - "2015:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/de"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
