services:
  web:
    build:
      context: .
      args:
        # Werte kommen aus der .env im Projektverzeichnis
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_MATOMO_URL: ${NEXT_PUBLIC_MATOMO_URL:-}
        NEXT_PUBLIC_MATOMO_SITE_ID: ${NEXT_PUBLIC_MATOMO_SITE_ID:-}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
        NEXT_PUBLIC_CAP_API_ENDPOINT: ${NEXT_PUBLIC_CAP_API_ENDPOINT:-}
        NEXT_PUBLIC_CAP_WIDGET_SRC: ${NEXT_PUBLIC_CAP_WIDGET_SRC:-}
    container_name: lts-website
    restart: unless-stopped
    ports:
      # Host-Port 2015 -> Container-Port 3000
      - "2015:3000"
    # Erlaubt dem Container, Host-Dienste (z.B. Cap auf Port 32770) über
    # host.docker.internal zu erreichen.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      # Hochgeladene Bilder bleiben über Rebuilds hinweg erhalten
      - ./public/uploads:/app/public/uploads
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/de"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
